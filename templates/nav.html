<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Design</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* Navbar background */
nav{
    background-color:#222;
    padding:15px;
}

/* Remove bullets */
ul{
    list-style:none;
    margin:0;
    padding:0;
    text-align:center;
}

/* Horizontal menu */
li{
    display:inline-block;
    margin:0 20px;
}

/* Link style */
a{
    text-decoration:none;
    color:white;
    font-size:18px;
    padding:8px 15px;
    transition:0.3s;
}

/* Hover effect */
a:hover{
    background:#00aaff;
    border-radius:5px;
}

</style>

</head>

<body>

<nav>
<ul>
<li><a href="/">Home</a></li>
<li><a href="/about">About</a></li>
<li><a href="/contact">Contact</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/blog">Blog</a></li>
</ul>
</nav>

</body>
</html>
