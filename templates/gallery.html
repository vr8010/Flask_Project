<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
}

/* Page title */

.title{
    text-align:center;
    margin-top:30px;
    color:#333;
}

/* Gallery layout */

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

/* Image box */

.gallery img{
    width:250px;
    height:180px;
    object-fit:cover;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    transition:0.3s;
}

/* Hover effect */

.gallery img:hover{
    transform:scale(1.05);
}

</style>

</head>

<body>

{% include 'nav.html' %}

<h1 class="title">Gallery</h1>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d" alt="Dog" width="300">
<img src="https://images.unsplash.com/photo-1517849845537-4d257902454a" alt="Cat" width="300">
<img src="https://images.unsplash.com/photo-1507146426996-ef05306b995a" alt="Fox" width="300">
<img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5" alt="Panda" width="300">
<img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2" alt="Tiger" width="300">
<img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d" alt="Lion" width="300">

</div>

</body>
</html>
