<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        h2{
            text-align:center;
            margin-top:30px;
        }

        form{
            width:400px;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        label{
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:4px;
        }

        input[type="submit"]{
            background:#333;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        input[type="submit"]:hover{
            background:#555;
        }
    </style>

</head>

<body>

<h2>Contact Us</h2>

<form action="#" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <input type="submit" value="Send Message">
</form>

</body>
</html>
